deployer:
  # Cluster apps domain injected by the deployer. When set, the x2ansible
  # Developer Hub OAuth callback URL is derived from x2ansible.<deployer.domain>
  domain: ""

setup:
  vault:
    # Namespace and pod name of the Vault instance to store the x2ansible
    # credentials in (via `kubectl exec` into the Vault pod)
    namespace: vault
    pod: vault-0
  x2ansible:
    username: x2ansible
    name: x2ansible
    email: x2ansible@redhat.com
    password: r3dh@t123

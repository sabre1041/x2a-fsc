apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.aap.name }}
  labels:
    {{- include "x2ansible.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.externalSecrets.aap.name }}
    creationPolicy: Owner
    template:
      # Merge the Vault-synced credentials with the Helm-injected values below
      mergePolicy: Merge
      data:
        AAP_ORG_NAME: {{ .Values.setup.aap.organization | quote }}
        AAP_URL: {{ .Values.setup.aap.url | quote }}
  data:
    - secretKey: AAP_OAUTH_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.aap.vaultPath }}
        property: token

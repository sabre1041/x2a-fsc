apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.aap.name }}
  labels:
    {{- include "x2ansible.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.externalSecrets.aap.name }}
    creationPolicy: Owner
  data:
    - secretKey: AAP_URL
      remoteRef:
        key: {{ .Values.externalSecrets.aap.vaultPath }}
        property: url
    - secretKey: AAP_OAUTH_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.aap.vaultPath }}
        property: token
    - secretKey: AAP_ORG_NAME
      remoteRef:
        key: {{ .Values.externalSecrets.aap.vaultPath }}
        property: organization
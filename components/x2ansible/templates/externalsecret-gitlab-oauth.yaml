apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.gitlabOAuth.name }}
  labels:
    {{- include "x2ansible.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.externalSecrets.gitlabOAuth.name }}
    creationPolicy: Owner
  data:
    - secretKey: AUTH_GITLAB_CLIENT_ID
      remoteRef:
        key: {{ .Values.externalSecrets.gitlabOAuth.vaultPath }}
        property: client_id
    - secretKey: AUTH_GITLAB_CLIENT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.gitlabOAuth.vaultPath }}
        property: client_secret
    - secretKey: AUTH_GITLAB_URL
      remoteRef:
        key: {{ .Values.externalSecrets.gitlabOAuth.vaultPath }}
        property: url

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecrets.secretStore.name }}
  labels:
    {{- include "x2ansible.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    vault:
      server: {{ include "x2ansible.vault.server" . }}
      path: {{ .Values.setup.vault.path }}
      version: v2
      caProvider:
        type: ConfigMap
        name: {{ .Values.externalSecrets.secretStore.caBundleConfigMap }}
        key: service-ca.crt
      auth:
        kubernetes:
          mountPath: {{ .Values.setup.vault.auth.mountPath }}
          role: {{ .Values.setup.vault.auth.role }}
          serviceAccountRef:
            name: {{ .Values.setup.vault.auth.serviceAccount.name }}

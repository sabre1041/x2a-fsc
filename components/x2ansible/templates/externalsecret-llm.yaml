apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.llm.name }}
  labels:
    {{- include "x2ansible.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.externalSecrets.llm.name }}
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.llm.vaultPath }}
        property: apiKey
    - secretKey: OPENAI_API_BASE
      remoteRef:
        key: {{ .Values.externalSecrets.llm.vaultPath }}
        property: apiUrl
    - secretKey: LLM_MODEL
      remoteRef:
        key: {{ .Values.externalSecrets.llm.vaultPath }}
        property: model

# Allow the aap-setup job to exec into the Vault pod and read the vault-token
# secret so it can store the x2ansible API token in Vault.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aap-setup-vault-exec
  namespace: {{ $.Values.setup.vault.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aap-setup-vault-exec
  namespace: {{ $.Values.setup.vault.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aap-setup-vault-exec
subjects:
- apiGroup: ""
  kind: ServiceAccount
  name: aap-setup
  namespace: {{ $.Release.Namespace }}

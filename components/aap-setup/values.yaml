setup:
  aap:
    # URL of the Ansible Automation Platform gateway
    url: ""
    # Admin credentials used to configure the platform
    adminUser: admin
    adminPassword: ""
    # Name of the organization to create
    organization: x2ansible
    # Dedicated platform admin user for automation
    x2ansible:
      username: x2ansible
      password: x2ansible
      email: x2ansible@redhat.com
      firstName: X2ansible
      lastName: X2ansible
  vault:
    # Namespace and pod name of the Vault instance to store the x2ansible
    # API token in (via `kubectl exec` into the Vault pod)
    namespace: vault
    pod: vault-0

# AnsibleAutomationPlatform custom resource updated by this chart (via ArgoCD
# server-side apply) after the setup job completes
ansibleAutomationPlatform:
  # Name and namespace of the existing AnsibleAutomationPlatform CR
  name: aap
  namespace: aap
  hub:
    # Content storage type; "file" uses the storage class below
    storageType: file
    # Storage class for hub file storage (must support ReadWriteMany);
    # when empty, the cluster default storage class is used
    fileStorageStorageClass: ""
    fileStorageSize: 10Gi

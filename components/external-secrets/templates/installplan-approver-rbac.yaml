{{- if eq .Values.operator.installPlanApproval "Manual" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-installplan-approver
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-installplan-approver
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: ["operators.coreos.com"]
    resources: ["subscriptions"]
    resourceNames: ["{{ .Values.operator.name }}"]
    verbs: ["get"]
  - apiGroups: ["operators.coreos.com"]
    resources: ["installplans"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding 
metadata:
  name: external-secrets-installplan-approver
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
subjects:
  - kind: ServiceAccount
    name: external-secrets-installplan-approver
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: external-secrets-installplan-approver
  apiGroup: rbac.authorization.k8s.io
{{- end }}

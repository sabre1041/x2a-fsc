apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-vault
  namespace: {{ .Values.controllerNamespace }}
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Apply to all pods in the namespace (the operator controller)
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    # Vault API server
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.vault.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.vault.name }}
              component: server
      ports:
        - protocol: TCP
          port: {{ .Values.vault.port }}

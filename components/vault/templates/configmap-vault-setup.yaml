kind: ConfigMap
metadata:
  name:  configmap-vault-setup
  annotations:
    argocd.argoproj.io/sync-wave: "3"
apiVersion: v1
data:
  playbook.yaml: |
    ---
    - name: Setup Vault
      hosts: localhost
      vars:
        vault_namespace: {{ $.Release.Namespace }}
      tasks:
        - name: Retrieve Vault Pod
          kubernetes.core.k8s_info:
            kind: Pod
            name: vault-0
            namespace: '{{ "{{" }} vault_namespace {{ "}}" }}'
          register: r_vault
          retries: 120
          delay: 5
          until:
            - r_vault.resources is defined
            - r_vault.resources | length > 0
            - r_vault.resources[0].status is defined
            - r_vault.resources[0].status.phase is defined
            - r_vault.resources[0].status.phase == 'Running'

        - name: Copy unsealing key
          ansible.builtin.shell: |
            oc exec vault-0 -n {{ "{{" }} vault_namespace {{ "}}" }} --stdin --tty -- cat /vault/data/vault-auto-unseal-keys.txt > /tmp/vault-auto-unseal-keys.txt
          retries: 60
          delay: 5
          register: r_copy
          until: r_copy is not failed        

        - name: Get login token
          ansible.builtin.shell: >-
            grep -A 0 root_token /tmp/vault-auto-unseal-keys.txt | sed 's/root_token: //g'
          register: r_token

        - name: Set vault token fact
          ansible.builtin.set_fact:
            vault_token: '{{ "{{" }} r_token.stdout {{ "}}" }}'

        - name: Create secret for Vault token
          kubernetes.core.k8s:
            state: present
            definition:
              kind: Secret
              apiVersion: v1
              metadata:
                name: vault-token
                namespace: '{{ "{{" }} vault_namespace {{ "}}" }}'
              stringData:
                token: '{{ "{{" }} vault_token {{ "}}" }}'
              type: Opaque

        - name: Login to vault
          ansible.builtin.shell: |
            oc exec vault-0 -n {{ "{{" }} vault_namespace {{ "}}" }} --stdin --tty -- vault login {{ "{{" }} vault_token {{ "}}" }}
          register: r_vault_login
          until: r_vault_login is not failed
          retries: 30
          delay: 10

        - name: Create vault policy
          ansible.builtin.shell: |
            oc exec vault-0 -n {{ "{{" }} vault_namespace {{ "}}" }} -- bash -c 'rm -rf /tmp/x2ansible-policy.hcl'
            oc exec vault-0 -n {{ "{{" }} vault_namespace {{ "}}" }} -- bash -c 'echo path \"/secret/data/x2ansible/*\" >> /tmp/x2ansible-policy.hcl'
            oc exec vault-0 -n {{ "{{" }} vault_namespace {{ "}}" }} -- bash -c 'echo {  capabilities = [\"read\", \"list\"] >> /tmp/x2ansible-policy.hcl'
            oc exec vault-0 -n {{ "{{" }} vault_namespace {{ "}}" }} -- bash -c 'echo } >> /tmp/x2ansible-policy.hcl'
            oc exec vault-0 -n {{ "{{" }} vault_namespace {{ "}}" }} -- bash -c 'vault policy write x2ansible-policy /tmp/x2ansible-policy.hcl'

        - name: Check enabled auth methods
          ansible.builtin.shell: |
            oc exec vault-0 -n {{ "{{" }} vault_namespace {{ "}}" }} -- vault auth list -format=json
          register: r_auth_list

        - name: Enable kubernetes auth
          ansible.builtin.shell: |
            oc exec vault-0 -n {{ "{{" }} vault_namespace {{ "}}" }} -- vault auth enable kubernetes
            oc exec vault-0 -n {{ "{{" }} vault_namespace {{ "}}" }} -- vault write auth/kubernetes/config \
            kubernetes_host="https://kubernetes.default.svc" \
            kubernetes_ca_cert="@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          when: '"kubernetes/" not in r_auth_list.stdout'

        - name: Check existing secrets engines
          ansible.builtin.shell: |
            oc exec vault-0 -n {{ "{{" }} vault_namespace {{ "}}" }} -- vault secrets list -format=json
          register: r_secrets_list

        - name: Enable kv Secrets engine
          ansible.builtin.shell: |
            oc exec vault-0 -n {{ "{{" }} vault_namespace {{ "}}" }} -- vault secrets enable -version=2 -path=secret kv
          when: '"secret/" not in r_secrets_list.stdout'

        - name: Create role and service account authentication
          ansible.builtin.shell: |
            oc exec vault-0 -n {{ "{{" }} vault_namespace {{ "}}" }} -- vault write auth/kubernetes/role/x2ansible-role \
            bound_service_account_names={{ $.Values.setup.x2ansible.serviceaccount.name }} \
            bound_service_account_namespaces={{ $.Values.setup.x2ansible.serviceaccount.namespace }} \
            token_policies=x2ansible-policy \
            ttl=160h
          register: r_create_role
          until: r_create_role is succeeded
          retries: 10
          delay: 5

{{- if and $.Values.llm.apiUrl $.Values.llm.apiKey $.Values.llm.model }}
        - name: Populate LLM secrets
          kubernetes.core.k8s_exec:
            namespace: '{{ "{{" }} vault_namespace {{ "}}" }}'
            pod: vault-0
            command: 'vault kv put secret/x2ansible/llm apiKey="{{ $.Values.llm.apiKey }}" apiUrl="{{ $.Values.llm.apiUrl }}" model="{{ $.Values.llm.model }}"'
{{- end }}

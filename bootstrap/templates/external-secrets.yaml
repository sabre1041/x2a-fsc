apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "bootstrap.metadata" (dict "name" .Values.externalSecrets.name "namespace" .Values.argocd.namespace "syncWave" "0") }}
spec:
  destination:
    namespace: {{ .Values.externalSecrets.namespace }}
    server: https://kubernetes.default.svc
  project: default
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
  source:
    path: components/external-secrets
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.revision }}
    helm:
      valuesObject:
        vault:
          name: {{ .Values.vault.name }}
          namespace: {{ .Values.vault.namespace }}
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true

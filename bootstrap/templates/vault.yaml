apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "bootstrap.metadata" (dict "name" .Values.vault.name "namespace" .Values.argocd.namespace "syncWave" "0") }}
spec:
  destination:
    namespace: {{ .Values.vault.namespace }}
    server: https://kubernetes.default.svc
  project: default
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
  source:
    path: components/vault
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.revision }}
{{- if and .Values.litemaas .Values.litemaas.apiKey .Values.litemaas.apiUrl .Values.litemaas.model }}
    helm:
      valuesObject:
        global:
          localClusterDomain: {{ .Values.deployer.domain }}
        llm:
          apiKey: {{ .Values.litemaas.apiKey | quote }}
          apiUrl: {{ .Values.litemaas.apiUrl | quote }}
          # litellm (used by x2a-convertor) requires a provider/model string.
          # LiteMaaS serves OpenAI-compatible endpoints
          # The RHDP deployer injects the bare model id (e.g. gpt-oss-120b-a5b),
          # so add the provider prefix unless one is already present.
          model: {{ if contains "/" .Values.litemaas.model }}{{ .Values.litemaas.model | quote }}{{ else }}{{ printf "openai/%s" .Values.litemaas.model | quote }}{{ end }}
{{- end }}
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true

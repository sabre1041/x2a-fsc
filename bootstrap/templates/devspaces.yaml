{{- if .Values.devspaces.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "bootstrap.metadata" (dict "name" .Values.devspaces.name "namespace" .Values.argocd.namespace "syncWave" "1") }}
spec:
  destination:
    namespace: {{ .Values.devspaces.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: components/devspaces
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.revision }}
{{ include "bootstrap.syncPolicy" . | indent 2 }}
{{- end }}
